services:
  # ── Base de datos ────────────────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_DB: rubusai
      POSTGRES_USER: rubus
      POSTGRES_PASSWORD: rubus_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rubus -d rubusai"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [fruit-net]

  # ── Cola de mensajes ─────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [fruit-net]

  # ── Backend principal (NestJS + Fastify) ─────────────────────────────────────
  fruit-backend:
    build:
      context: .
      dockerfile: fruit-backend/Dockerfile
    ports:
      - "3001:3000"
    env_file: ./fruit-backend/.env
    environment:
      DATABASE_URL: "postgresql://rubus:rubus_dev@postgres:5432/rubusai"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672"
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks: [fruit-net]

  # ── Servicio de inferencia Python (YOLO) ─────────────────────────────────────
  fruit-inference:
    build: ./fruit-inference
    ports:
      - "127.0.0.1:8000:8000"
    env_file: ./fruit-inference/.env
    volumes:
      # Monta el modelo .pt desde la carpeta fruit-inference sin incluirlo en la imagen
      - ./fruit-inference/best.pt:/app/model.pt:ro
    networks: [fruit-net]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s # El modelo puede tardar en cargarse

  # ── Microservicio consumidor RabbitMQ (NestJS) ───────────────────────────────
  fruit-ms:
    build:
      context: .
      dockerfile: fruit-ms/Dockerfile
    env_file: ./fruit-ms/.env
    environment:
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672"
      INFERENCE_URL: "http://fruit-inference:8000"
      DATABASE_URL: "postgresql://rubus:rubus_dev@postgres:5432/rubusai"
    depends_on:
      rabbitmq:
        condition: service_healthy
      fruit-inference:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks: [fruit-net]

  # ── Panel web (React + Vite) ─────────────────────────────────────────────────
  zarza-web:
    build:
      context: ./zarza-web
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - ./zarza-web:/app
      - /app/node_modules
    environment:
      VITE_API_TARGET: http://fruit-backend:3000
    depends_on:
      - fruit-backend
    networks: [fruit-net]

networks:
  fruit-net:
    driver: bridge

volumes:
  postgres_data:
