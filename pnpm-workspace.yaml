packages:
  - 'fruit-backend'
  - 'fruit-ms'
  - 'packages/*'
allowBuilds:
  '@firebase/util': true
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  bcrypt: true
  prisma: true
  protobufjs: true
  unrs-resolver: true
# pnpm 11 ya no lee el campo "pnpm" de package.json: los overrides de seguridad
# viven aqui, no en fruit-backend/package.json ni fruit-ms/package.json.
overrides:
  multer: '>=2.2.0 <3.0.0'
  uuid: '>=11.1.1 <12.0.0'
  ajv: '>=8.18.0'
  flatted: '>=3.4.2'
  follow-redirects: '>=1.16.0'
  handlebars: '>=4.7.9'
  lodash: '>=4.18.0'
  minimatch: '>=10.2.3'
  path-to-regexp: '>=8.4.0'
  picomatch: '>=4.0.4'
  qs: '>=6.14.2'
  serialize-javascript: '>=7.0.3'
  # Pisos por alerta de Dependabot (transitivas). Acotados al major que piden
  # sus consumidores: sin techo, pnpm arrastraria fast-uri 4.x y protobufjs 8.x.
  fast-uri: '>=3.1.4 <4.0.0'
  fast-xml-parser: '>=5.10.1 <6.0.0'
  find-my-way: '>=9.7.0 <10.0.0'
  protobufjs: '>=7.6.5 <8.0.0'
