upstream fruit_backend {
    server 100.112.223.6:3000; # rubus-app por Tailscale
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name rubusai.tech www.rubusai.tech;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location = /healthz { access_log off; return 200 "ok\n"; }
    location / { return 301 https://rubusai.tech$request_uri; }
}

# www → dominio principal (las cookies de sesión son SameSite=Strict por host)
server {
    listen 443 ssl;
    http2 on;
    server_name www.rubusai.tech;
    ssl_certificate     /etc/letsencrypt/live/rubusai.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rubusai.tech/privkey.pem;
    return 301 https://rubusai.tech$request_uri;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name rubusai.tech;

    ssl_certificate     /etc/letsencrypt/live/rubusai.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rubusai.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    server_tokens off;

    # Cabeceras de seguridad. No se definen add_header dentro de los location:
    # hacerlo anularía estas para ese bloque.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # El backend acepta imágenes de hasta 5 MB; margen para el multipart.
    client_max_body_size 6m;

    root /usr/share/nginx/html;
    index index.html;

    # Endpoints entre servicios (fruit-ms, fruit-training): nunca desde internet.
    location ^~ /api/v1/internal/ { return 404; }

    location /api/ {
        proxy_pass http://fruit_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Se sobrescribe (no se añade) para que el cliente no pueda falsear su IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /ws {
        proxy_pass http://fruit_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Vite pone hash en los nombres de /assets: se pueden cachear indefinidamente.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location = /healthz { access_log off; return 200 "ok\n"; }

    # SPA: cualquier otra ruta la resuelve React Router.
    location / {
        try_files $uri /index.html;
    }
}
