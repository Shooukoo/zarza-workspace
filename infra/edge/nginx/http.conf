# Solo para el primer arranque, antes de emitir el certificado: responde al reto
# de Let's Encrypt y nada más. Después se usa https.conf.
server {
    listen 80 default_server;
    server_name rubusai.tech www.rubusai.tech;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location = /healthz { access_log off; return 200 "ok\n"; }
    location / { return 404; }
}
