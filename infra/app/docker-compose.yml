# rubus-app: fruit-backend (API + WebSocket) y fruit-ms (consumidor RabbitMQ).
# Sin estado. Publican SOLO en la IP de Tailscale. Ejecutar desde la raíz del repo:
#   docker compose -f infra/app/docker-compose.yml up -d --build
#   docker compose -f infra/app/docker-compose.yml run --rm migrate     # migraciones Prisma
# Variables: infra/app/.env (ver .env.example; el real vive solo en el servidor).
name: rubus-app

services:
  fruit-backend:
    build:
      context: ../..
      dockerfile: fruit-backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    mem_limit: 2g
    ports:
      - "${TS_IP}:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:3000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  fruit-ms:
    build:
      context: ../..
      dockerfile: fruit-ms/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      BACKEND_URL: http://fruit-backend:3000
    mem_limit: 1g
    ports:
      - "${TS_IP}:3002:3002" # solo healthcheck, para el monitoreo
    depends_on:
      fruit-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:3002/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Las imágenes finales no llevan el CLI de Prisma; se usa el stage builder.
  migrate:
    profiles: [tools]
    build:
      context: ../..
      dockerfile: fruit-backend/Dockerfile
      target: builder
    env_file: .env
    command: ["pnpm", "--filter", "@rubus/database", "run", "migrate:deploy"]
